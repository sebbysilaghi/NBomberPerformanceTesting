<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance Demo Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
    input { padding: .7rem; width: min(95%, 420px); }
    li { margin: .7rem 0; } .muted { color: #606875; }
  </style>
</head>
<body>
  <main>
    <h1>Performance Demo Shop</h1>
    <p class="muted">A local, synthetic application for educational load testing.</p>
    <label for="search">Search products</label><br />
    <input id="search" type="search" placeholder="Type a product name" autocomplete="off" />
    <p id="status" role="status">Loading…</p>
    <ul id="products"></ul>
  </main>
  <script>
    const search = document.querySelector('#search');
    const status = document.querySelector('#status');
    const list = document.querySelector('#products');
    let requestId = 0;
    async function loadProducts() {
      const current = ++requestId;
      try {
        const response = await fetch('/api/products?q=' + encodeURIComponent(search.value));
        if (!response.ok) throw new Error('Products API failed: ' + response.status);
        const products = await response.json();
        if (current !== requestId) return;
        list.replaceChildren();
        for (const product of products) {
          const item = document.createElement('li');
          item.textContent = `${product.name} — $${product.price.toFixed(2)}`;
          list.append(item);
        }
        status.textContent = `${products.length} products found`;
      } catch (error) {
        if (current === requestId) status.textContent = String(error);
      }
    }
    search.addEventListener('input', loadProducts);
    loadProducts();
  </script>
</body>
</html>
